<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7688"/>
    </marker>
    <style>
      .h1   { font-size: 34px; font-weight: 700; fill: #e6edf3; }
      .h2   { font-size: 17px; fill: #9198a1; }
      .band { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
      .card { font-size: 21px; font-weight: 600; fill: #e6edf3; }
      .cs   { font-size: 16px; fill: #9198a1; }
      .stage{ font-size: 19px; font-weight: 700; fill: #ffffff; }
      .ss   { font-size: 15px; fill: #c9d1d9; }
      .edge { stroke: #6b7688; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="700" fill="#0d1117"/>
  <text x="60" y="54" class="h1">How It All Fits Together</text>
  <text x="62" y="86" class="h2">One Nextflow command assembles code, input, reference data and containers into a run</text>

  <!-- ===== TOP: the four ingredients ===== -->
  <text x="60" y="134" class="band" fill="#adbac7">CODE</text>
  <rect x="60" y="146" width="275" height="132" rx="12" fill="#1c2128" stroke="#adbac7" stroke-width="2"/>
  <text x="80" y="184" class="card">Pipeline &amp; config</text>
  <text x="80" y="218" class="cs">amd-ph-core/tbvarpipe</text>
  <text x="80" y="246" class="cs">+ configs · modules</text>

  <text x="355" y="134" class="band" fill="#57d38c">INPUT</text>
  <rect x="355" y="146" width="275" height="132" rx="12" fill="#122b1e" stroke="#57d38c" stroke-width="2"/>
  <text x="375" y="184" class="card">Sample sheet</text>
  <text x="375" y="218" class="cs">samplesheet.csv</text>
  <text x="375" y="246" class="cs">your reads, or our test data</text>

  <text x="650" y="134" class="band" fill="#6cb6ff">REFERENCE</text>
  <rect x="650" y="146" width="275" height="132" rx="12" fill="#10243a" stroke="#6cb6ff" stroke-width="2"/>
  <text x="670" y="184" class="card">Static assets</text>
  <text x="670" y="218" class="cs">one root → every path</text>
  <text x="670" y="246" class="cs">tarball or S3 bucket</text>

  <text x="945" y="134" class="band" fill="#54d1f5">CONTAINERS</text>
  <rect x="945" y="146" width="275" height="132" rx="12" fill="#0e2a33" stroke="#54d1f5" stroke-width="2"/>
  <text x="965" y="184" class="card">Images</text>
  <text x="965" y="218" class="cs">quay.io/us-cdcgov</text>
  <text x="965" y="246" class="cs">one per process</text>

  <!-- arrows down into engine -->
  <path class="edge" d="M197,278 L197,310" marker-end="url(#a)"/>
  <path class="edge" d="M492,278 L492,310" marker-end="url(#a)"/>
  <path class="edge" d="M787,278 L787,310" marker-end="url(#a)"/>
  <path class="edge" d="M1082,278 L1082,310" marker-end="url(#a)"/>

  <!-- ===== ENGINE BAR ===== -->
  <rect x="60" y="318" width="1160" height="86" rx="14" fill="#22406e"/>
  <text x="86" y="358" class="stage" font-size="22">nextflow run amd-ph-core/tbvarpipe -profile docker -c local.config</text>
  <text x="86" y="388" class="ss">merges config · resolves reference paths · pulls containers</text>

  <path class="edge" d="M640,404 L640,440" marker-end="url(#a)"/>

  <!-- ===== PIPELINE STAGES ===== -->
  <text x="60" y="436" class="band" fill="#9198a1">PIPELINE STAGES</text>

  <g>
    <rect x="60" y="450" width="216" height="144" rx="12" fill="#2d333b"/>
    <text x="78" y="488" class="stage">1 · Preprocess</text>
    <text x="78" y="522" class="ss">merge lanes · trim</text>

    <rect x="296" y="450" width="216" height="144" rx="12" fill="#2d333b"/>
    <text x="314" y="488" class="stage">2 · Decontaminate</text>
    <text x="314" y="522" class="ss">Clockwork</text>

    <rect x="532" y="450" width="216" height="144" rx="12" fill="#2d333b"/>
    <text x="550" y="488" class="stage">3 · Variant calling</text>
    <text x="550" y="522" class="ss">BWA · Mutect2</text>
    <text x="550" y="548" class="ss">SnpEff</text>

    <rect x="768" y="450" width="216" height="144" rx="12" fill="#2d333b"/>
    <text x="786" y="488" class="stage">4 · Lineage</text>
    <text x="786" y="522" class="ss">coverage · lineage</text>
    <text x="786" y="548" class="ss">PDF report</text>

    <rect x="1004" y="450" width="216" height="144" rx="12" fill="#17612a"/>
    <text x="1022" y="488" class="stage">5 · Aggregate</text>
    <text x="1022" y="522" class="ss">MultiQC · results/</text>
  </g>

  <!-- stage arrows -->
  <path class="edge" d="M276,522 L296,522" marker-end="url(#a)"/>
  <path class="edge" d="M512,522 L532,522" marker-end="url(#a)"/>
  <path class="edge" d="M748,522 L768,522" marker-end="url(#a)"/>
  <path class="edge" d="M984,522 L1004,522" marker-end="url(#a)"/>

  <!-- ===== FOOTER ===== -->
  <rect x="60" y="614" width="1160" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="644" class="band" fill="#e6edf3">SAME PIPELINE, ANY ENVIRONMENT</text>
  <text x="82" y="670" class="cs">Only the static-assets root and the container registry change per environment.</text>
</svg>
